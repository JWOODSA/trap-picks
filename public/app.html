/* One deliberate theme: city at night. Black streets, trap red, white light. */

.tt .ab { font-family: var(--disp); font-weight: 900; font-size: 30px; line-height: 1; }
.tt .nm { font-size: 12px; color: var(--ink2); margin: 2px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt .st { display: flex; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.tt .st b { color: var(--ink); }
.tabs2 { display: flex; gap: 6px; margin: 0 0 12px; overflow-x: auto; scrollbar-width: none; }
.tabs2 button { padding: 8px 12px; border-radius: 999px; background: var(--card); font-size: 14px; font-weight: 600; white-space: nowrap; color: var(--ink2); }
.tabs2 button[aria-pressed=true] { background: var(--yel); color: #ffffff; }

/* Team header */
.th { margin: 16px 0 12px; border-radius: 20px; padding: 18px 16px; color: #fff; position: relative; overflow: hidden; }
.th .ab { font-family: var(--disp); font-weight: 900; font-size: 64px; line-height: .85; }
.th .nm { font-size: 17px; font-weight: 600; }
.th .co { font-size: 13px; opacity: .9; margin-top: 4px; }
.th .big { position: absolute; right: -10px; bottom: -28px; font-family: var(--disp); font-weight: 900; font-size: 150px; opacity: .14; line-height: 1; }
.sched { display: grid; gap: 4px; }
.sg { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 9px; background: var(--bg2); font-size: 14px; }
.sg .wk { font-family: var(--mono); font-size: 12px; color: var(--ink3); }
.sg .op { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.sg .op small { color: var(--ink3); font-weight: 400; }
.res { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-family: var(--mono); font-size: 12px; font-weight: 700; color: #070708; }
.res.W { background: var(--grn); } .res.L { background: var(--red); } .res.P, .res.T { background: var(--ink3); }
.sg .sc { font-family: var(--mono); font-size: 13px; display: flex; gap: 6px; align-items: center; }
.sg .ln { font-family: var(--mono); font-size: 12px; color: var(--ink2); text-align: right; min-width: 64px; }

/* Player */
.ph { margin: 16px 0 12px; border-radius: 20px; padding: 18px 16px; color: #fff; position: relative; overflow: hidden; min-height: 150px; }
.ph .num { position: absolute; right: 8px; top: -14px; font-family: var(--disp); font-weight: 900; font-size: 160px; line-height: 1; opacity: .22; }
.ph .pn { font-family: var(--disp); font-weight: 900; font-size: 40px; line-height: .95; text-transform: uppercase; max-width: 75%; }
.ph .meta { font-size: 13px; opacity: .92; margin-top: 8px; line-height: 1.5; }
.ph .inj { display: inline-block; margin-top: 8px; padding: 4px 9px; border-radius: 6px; background: rgba(0,0,0,.35); font-size: 13px; font-weight: 700; }
.stepper { display: flex; align-items: center; gap: 10px; margin: 6px 0 12px; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; background: var(--card2); font-size: 22px; font-weight: 700; }
.stepper .ln { font-family: var(--mono); font-size: 22px; font-weight: 700; min-width: 80px; text-align: center; }
.stepper .hit { margin-left: auto; text-align: right; }
.stepper .hit b { display: block; font-family: var(--mono); font-size: 22px; color: var(--yel); }
.stepper .hit span { font-size: 12px; color: var(--ink3); }
.bars svg { display: block; width: 100%; height: auto; }
.stepper input { width: 84px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); font-family: var(--mono); font-size: 20px; font-weight: 700; text-align: center; }
.pc-odds { display: flex; align-items: center; gap: 8px; margin: -4px 0 12px; font-size: 13px; color: var(--ink3); }
.pc-odds input { width: 74px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); font-family: var(--mono); font-size: 15px; text-align: center; }
.hr { display: grid; grid-template-columns: 1fr auto 64px; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hr b { font-family: var(--mono); font-size: 15px; text-align: right; }
.hr .n { font-family: var(--mono); font-size: 12.5px; color: var(--ink3); }
.hr.good b { color: var(--grn); } .hr.bad b { color: var(--red); }
.hr small { display: block; font-size: 11.5px; color: var(--ink3); }
.pc-find { position: relative; }
#prop { scroll-margin-top: 76px; }
.pc-find .res { display: grid; gap: 6px; margin-top: 8px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: right; font-weight: 600; color: var(--ink3); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 6px 6px; }
.tbl td { text-align: right; padding: 7px 6px; font-family: var(--mono); border-top: 1px solid var(--line); }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.scroll { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }

/* Record */
.bigrec { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.bigrec .b { border-radius: 16px; padding: 14px; background: var(--card); border: 1px solid var(--line); }
.bigrec .b.hot { background: linear-gradient(150deg, #350907, #170403); border-color: #5c0f0b; }
.bigrec b { display: block; font-family: var(--disp); font-weight: 900; font-size: 42px; line-height: 1; }
.bigrec .hot b { color: var(--yel); }
.bigrec span { display: block; font-size: 13px; color: var(--ink2); margin-top: 4px; }
.bigrec small { display: block; font-family: var(--mono); font-size: 12px; color: var(--ink3); margin-top: 4px; }
.lg { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 10px; background: var(--bg2); margin-bottom: 6px; font-size: 14px; }
.tag { font-family: var(--disp); font-weight: 800; font-size: 13px; letter-spacing: .06em; padding: 3px 7px; border-radius: 5px; }
.tag.TRAP { background: var(--red); color: #fff; } .tag.LEAN { background: var(--org); color: #220605; } .tag.PASS { background: var(--card2); color: var(--ink2); }
.chk { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.chk:first-of-type { border-top: 0; }
.chk i { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex: none; background: var(--grn); }
.chk i.warn { background: var(--org); } .chk i.fail { background: var(--red); }
.chk small { display: block; color: var(--ink3); font-size: 12.5px; }
details.card summary { cursor: pointer; font-family: var(--disp); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; list-style: none; }
details.card summary::after { content: '+'; float: right; color: var(--ink3); }
details.how { border-color: #5c0f0b; background: linear-gradient(150deg, #2a2003, var(--card) 60%); }
details.how summary { color: var(--yel); }
details.how summary::after { color: var(--yel); margin-top: -22px; }
details.how summary small { display: block; font-family: var(--body); font-size: 13px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--ink2); }
details.card[open] summary::after { content: '–'; }
details.card[open] summary { margin-bottom: 10px; }
.explain { font-size: 14px; color: var(--ink2); line-height: 1.5; }
.explain b { color: var(--ink); }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: rgba(10,10,12,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.tabbar nav { display: flex; width: 100%; max-width: 560px; }
.tabbar nav a { flex: 1; }
body:not([data-sport=nfl]) .tabbar a.nfl, body:not([data-sport=nba]) .tabbar a.nba, body:not([data-sport=ncaab]) .tabbar a.cbb { display: none; }
.gm .gm-i { font-size: 20px; width: 34px; text-align: center; }
.gm .prow .gbtn { padding: 8px 14px; font-size: 14px; }
.gm-add summary { cursor: pointer; font-weight: 700; color: var(--yel); padding: 10px 2px 2px; list-style: none; }
.gm-add summary::-webkit-details-marker { display: none; }
.gm-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gm-btns button { padding: 12px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); color: var(--ink); font: inherit; font-weight: 600; font-size: 14px; text-align: left; }
.pkg { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.pkg .pkm { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink3); margin-bottom: 8px; }
.pkg .pkb { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pkg .pkb button { display: flex; align-items: center; gap: 7px; min-height: 48px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); color: var(--ink); font: inherit; font-weight: 700; font-size: 15px; text-align: left; }
.pkg .pkb button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pkg .pkb button small { font-family: var(--mono); font-size: 11px; color: var(--ink3); font-weight: 500; }
.pkg .pkb button[aria-pressed=true] { border-color: var(--yel); background: rgba(245,38,27,.16); }
.pkg .pkb button.w { border-color: var(--grn); }
.pkg .pkb button.w[aria-pressed=true] { background: rgba(61,220,151,.16); }
.pkg .pkb button.l { opacity: .55; }
.pkg .pkb button:disabled { cursor: default; }
.pkg .pkb i { width: 5px; height: 22px; border-radius: 3px; flex: none; }
.pkg .pkf { font-size: 12px; color: var(--ink3); margin-top: 8px; }
.cg { display: block; width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); margin-bottom: 10px; }
.cg .cg-r { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; padding: 3px 0; }
.cg .cg-r i { width: 6px; height: 18px; border-radius: 3px; flex: none; }
.cg .cg-r small { font-family: var(--mono); font-size: 11.5px; color: var(--ink3); font-weight: 500; }
.cg .cg-r span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cg .cg-l { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.cg .cg-l span { font-family: var(--mono); font-size: 12.5px; padding: 4px 9px; border-radius: 999px; background: var(--card2); }
.cg .cg-l span.our { background: rgba(245,38,27,.14); color: var(--ink); }
.cg .cg-t { margin-left: auto; font-size: 12px; color: var(--ink3); font-weight: 500; }
/* Sport switcher */
.sport { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); font-weight: 800; font-size: 14px; letter-spacing: .03em; }
.sport svg { width: 12px; height: 12px; opacity: .7; }
.top .sub .upd { display: block; margin-top: 3px; }
.sports { display: grid; gap: 12px; margin-top: 14px; }
.sp { position: relative; display: block; width: 100%; text-align: left; padding: 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
.sp.on { border-color: var(--yel); box-shadow: 0 0 0 1px var(--yel) inset; }
.sp .sp-h { display: flex; align-items: center; gap: 10px; }
.sp .sp-i { font-size: 30px; line-height: 1; }
.sp h2 { font-family: var(--disp); font-size: 26px; margin: 0; letter-spacing: .02em; }
.sp .sp-s { margin-left: auto; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: var(--yel); color: #fff; }
.sp .sp-s.soon { background: var(--card2); color: var(--ink3); }
.sp ul { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; color: var(--ink2); }
.sp ul li::before { content: '✓ '; color: var(--grn); font-weight: 800; }
.sp.soonc { opacity: .62; }
.sp.soonc ul li::before { content: '· '; color: var(--ink3); }
.ngame { display: block; width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); margin-bottom: 10px; }
.ngame .ng-h { display: flex; align-items: center; gap: 8px; font-family: var(--disp); font-size: 22px; }
.ngame .ng-h small { margin-left: auto; font-family: var(--body, inherit); font-size: 12px; color: var(--ink3); }
.ngame .ng-p { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.imp { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(245,38,27,.08); border: 1px solid rgba(245,38,27,.35); font-size: 13.5px; line-height: 1.4; }
.imp h4 { margin: 0 0 6px; font-family: var(--disp); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--yel); }
.imp p { margin: 0; } .imp p + p { margin-top: 6px; }
.imp small { display: block; margin-top: 6px; font-size: 11.5px; color: var(--ink3); }
.ngame .imp { background: transparent; border-color: var(--line); }
.ngame .ng-p button { font-size: 12.5px; padding: 6px 10px; border-radius: 999px; background: var(--card2); color: var(--ink); }
.tabbar a { display: grid; justify-items: center; gap: 3px; padding: 4px 0; text-decoration: none; color: var(--ink3); font-size: 10.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
.tabbar a svg { width: 24px; height: 24px; }
.tabbar a[aria-current=page] { color: var(--yel); }
/* Fantasy hoops */
.fh { margin: 18px 0 12px; padding: 18px 16px; border-radius: 20px; background: linear-gradient(150deg, #f5261b, #7a0d08 60%, #1a0505); color: #fff; position: relative; overflow: hidden; }
.fh h1 { font-family: var(--disp); font-weight: 900; font-size: 40px; line-height: .9; margin: 0; text-transform: uppercase; }
.fh p { margin: 8px 0 0; font-size: 14px; line-height: 1.4; opacity: .95; }
.fh .ball { position: absolute; right: -26px; top: -26px; width: 130px; height: 130px; opacity: .18; }
.fseg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--card); margin: 12px 0 10px; }
.fseg button { padding: 10px 0; border-radius: 9px; font-weight: 700; color: var(--ink2); }
.fseg button[aria-pressed=true] { background: var(--ink); color: var(--bg); }
.frow { display: grid; grid-template-columns: 30px auto 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; background: var(--bg2); text-align: left; width: 100%; border-left: 4px solid var(--tc); }
.frow .rk { font-family: var(--mono); font-size: 13px; color: var(--ink3); text-align: right; }
.frow .pos { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 3px 6px; border-radius: 5px; background: var(--card2); color: var(--ink2); }
.frow .nm { font-weight: 600; font-size: 15px; min-width: 0; }
.frow .nm small { display: block; font-weight: 400; color: var(--ink3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frow .vl { font-family: var(--mono); font-size: 15px; font-weight: 700; text-align: right; }
.frow .vl small { display: block; font-size: 10px; color: var(--ink3); font-weight: 500; }
.new { color: var(--yel); font-weight: 700; }
.up { color: var(--grn); } .dn { color: var(--red); }
.zbars { display: grid; gap: 6px; }
.zb { display: grid; grid-template-columns: 44px 1fr 48px; gap: 8px; align-items: center; font-size: 13px; }
.zb .tr { position: relative; height: 12px; border-radius: 6px; background: var(--bg2); }
.zb .tr::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--ink3); }
.zb .tr i { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.zb .v { font-family: var(--mono); text-align: right; }
.wkg { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.wkg div { border-radius: 10px; padding: 10px; background: var(--bg2); border-top: 4px solid var(--tc); }
.wkg b { display: block; font-family: var(--disp); font-weight: 900; font-size: 24px; line-height: 1; }
.wkg span { font-size: 12px; color: var(--ink2); }
/* Live scores */
.lcard { padding: 4px 14px; }
.lcard h3 { margin-top: 10px; }
.lrow { padding: 12px 0; border-top: 1px solid var(--line); cursor: default; }
.lrow[role=link] { cursor: pointer; }
.lcard .lrow:first-child, .lcard h3 + .lrow { border-top: 0; }
.lhd { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
.lhd .st { font-weight: 700; color: var(--ink2); }
.lhd .st.red { color: var(--red); }
.lt { display: grid; grid-template-columns: 12px 1fr auto 52px 58px; gap: 8px; align-items: center; padding: 3px 0; font-size: 16px; }
.lt .chip { width: 12px; height: 12px; border-radius: 3px; }
.lt b { font-family: var(--disp); font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 6px; }
.lt .ball { width: 10px; height: 7px; border-radius: 50%; background: #c46a2b; display: inline-block; }
.lt .sc { font-size: 22px; font-weight: 700; min-width: 30px; text-align: right; }
.lt .pc { font-size: 14px; font-weight: 700; text-align: right; color: var(--yel); }
.lt .ml { font-size: 12px; color: var(--ink3); text-align: right; }
.lbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 6px 0 2px; background: var(--bg2); gap: 2px; }
.lbar i { display: block; height: 100%; transition: width .6s ease; }
.lplay { font-size: 13px; color: var(--ink2); margin-top: 6px; line-height: 1.4; }
.lplay b { color: var(--ink); }
.lcall { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; margin-top: 8px; padding: 8px 10px; border-radius: 9px; background: var(--bg2); font-size: 14px; }
.lbadge { margin: 2px 0 6px; font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--red); }
.lbadge[hidden] { display: none; }
.loading { padding: 60px 0; text-align: center; color: var(--ink3); }
.fade { animation: f .22s ease-out; }
@keyframes f { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
:focus-visible { outline: 2px solid var(--yel); outline-offset: 2px; }

/* ===== Compact app layer: native-app density on phones ===== */
html, body { font-size: 15px; }
.wrap { padding: 0 12px calc(72px + env(safe-area-inset-bottom)); }
.top { margin: 0 -12px; padding: 8px 12px; min-height: 48px; }
.mark { font-size: 21px; }
.back { width: 32px; height: 32px; }
.top .sub { font-size: 11px; }
.sh { margin: 18px 2px 8px; }
.sh h2 { font-size: 19px; letter-spacing: .03em; }
.sh span { font-size: 12px; }
.card { padding: 12px; margin-bottom: 10px; border-radius: 12px; }
.card h3 { font-size: 16px; margin-bottom: 8px; }
details.card summary { font-size: 16px; }
.muted { font-size: 13px; }
.explain { font-size: 13.5px; }
.kv { gap: 6px; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
.kv div { padding: 8px; }
.kv b { font-size: 16px; }
.kv span { font-size: 11px; }
.search { padding: 10px 12px; font-size: 16px; margin: 10px 0 8px; border-radius: 10px; }
.tabs2 { gap: 5px; margin-bottom: 8px; }
.tabs2 button { padding: 6px 11px; font-size: 13px; }
.fseg { margin: 10px 0 8px; padding: 3px; border-radius: 10px; }
.fseg button { padding: 7px 0; font-size: 14px; border-radius: 8px; }
.prow, .frow { padding: 7px 9px; gap: 8px; border-radius: 9px; }
.plist { gap: 4px; }
.prow .nm, .frow .nm { font-size: 14px; }
.prow .nm small, .frow .nm small { font-size: 11.5px; }
.frow .vl { font-size: 14px; }
.facts li { padding: 8px 10px 8px 12px; font-size: 13.5px; }
.tbl { font-size: 12.5px; }
.tbl td { padding: 6px 5px; }

/* Board hero, compact */
.hero { margin: 10px 0 4px; padding: 14px 14px 16px; border-radius: 16px; }
.hero::after { height: 5px; }
.hero h1 { font-size: 34px; line-height: 1; white-space: nowrap; }
.hero h1 span { display: inline; }
.hero .lede { margin: 6px 0 10px; font-size: 14px; line-height: 1.4; color: var(--ink2); max-width: none; }
.hero .lede em { font-style: normal; font-weight: 700; color: var(--yel); }
.hero .keys { display: flex; gap: 6px; margin: 0 0 10px; }
.hero .keys div { display: flex; align-items: center; gap: 6px; padding: 5px 8px 5px 5px; border-radius: 8px; font-size: 12px; white-space: nowrap; }
.hero .keys .tag { font-size: 11px; padding: 2px 6px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stats div { padding: 8px; border-radius: 10px; background: rgba(255,255,255,.06); }
.stats b { display: block; font-family: var(--mono); font-size: 17px; font-weight: 700; color: var(--ink); }
.stats div.hot b { color: var(--yel); }

/* weather graphic */
.wxart { position: relative; border-radius: 14px; overflow: hidden; }
.wxsvg { display: block; width: 100%; height: auto; }

.wxb { display: inline-block; margin: 4px 12px 0; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #e6eefb; color: #3a0b09; }
.wxb.wet { background: #d4e6ff; color: #0b3d8c; } .wxb.wind { background: #fff1c2; color: #6b4e00; }
.wx-sun { animation: wxspin 24s linear infinite; transform-box: fill-box; transform-origin: center; }
.wx-drop { animation: wxfall .9s linear infinite; }
.wx-flake { animation: wxsnow 3s linear infinite; }
.wx-drift { animation: wxdrift 9s ease-in-out infinite alternate; }
.wx-drift2 { animation: wxdrift 12s ease-in-out infinite alternate-reverse; }
.wx-bolt { animation: wxflash 3.2s steps(1) infinite; }
.wx-streak { stroke-dasharray: 60 260; animation: wxwind 2.2s linear infinite; }
.wx-flag { transform-box: fill-box; transform-origin: left center; animation: wxflap 1.6s ease-in-out infinite; }
.wx-flag.fast { animation-duration: .5s; }
@keyframes wxspin { to { transform: rotate(360deg); } }
@keyframes wxfall { from { transform: translateY(0); opacity: 1; } to { transform: translateY(62px); opacity: .2; } }
@keyframes wxsnow { from { transform: translate(0, 0); } to { transform: translate(-10px, 72px); } }
@keyframes wxdrift { to { transform: translateX(14px); } }
@keyframes wxflash { 0%, 100% { opacity: 0; } 8%, 12% { opacity: 1; } }
@keyframes wxwind { from { stroke-dashoffset: 320; } to { stroke-dashoffset: 0; } }
@keyframes wxflap { 50% { transform: scaleY(.8) skewY(4deg); } }
@media (prefers-reduced-motion: reduce) { .wxsvg * { animation: none !important; } }

<script>
(() => {
  'use strict';
  const COLORS = { ARI: '#b3264a', ATL: '#c8102e', BAL: '#5b3fb5', BUF: '#1d5fd6', CAR: '#0085ca', CHI: '#e0581f', CIN: '#fb4f14',
    CLE: '#ff6a2b', DAL: '#2c5fc4', DEN: '#fb4f14', DET: '#0076b6', GB: '#2f7d4f', HOU: '#c8102e', IND: '#2a62b8', JAX: '#00838f',
    KC: '#e31837', LV: '#8f979b', LAC: '#0a9be0', LA: '#2a5fd1', MIA: '#00a3ad', MIN: '#6a3cc2', NE: '#c60c30', NO: '#c4a96a',
    NYG: '#2448b5', NYJ: '#1f8a55', PHI: '#00838a', PIT: '#f2b30b', SF: '#c41e1e', SEA: '#69be28', TB: '#d50a0a', TEN: '#4b92db', WAS: '#9b2a2a' };
  const NAMES = { ARI: 'Arizona Cardinals', ATL: 'Atlanta Falcons', BAL: 'Baltimore Ravens', BUF: 'Buffalo Bills', CAR: 'Carolina Panthers', CHI: 'Chicago Bears',
    CIN: 'Cincinnati Bengals', CLE: 'Cleveland Browns', DAL: 'Dallas Cowboys', DEN: 'Denver Broncos', DET: 'Detroit Lions', GB: 'Green Bay Packers', HOU: 'Houston Texans',
    IND: 'Indianapolis Colts', JAX: 'Jacksonville Jaguars', KC: 'Kansas City Chiefs', LV: 'Las Vegas Raiders', LAC: 'Los Angeles Chargers', LA: 'Los Angeles Rams',
    MIA: 'Miami Dolphins', MIN: 'Minnesota Vikings', NE: 'New England Patriots', NO: 'New Orleans Saints', NYG: 'New York Giants', NYJ: 'New York Jets',
    PHI: 'Philadelphia Eagles', PIT: 'Pittsburgh Steelers', SF: 'San Francisco 49ers', SEA: 'Seattle Seahawks', TB: 'Tampa Bay Buccaneers', TEN: 'Tennessee Titans',
    WAS: 'Washington Commanders' };
  const LABEL = { TRAP: 'TRAP', LEAN: 'WATCH', PASS: 'PASS', LOCK: 'PRO' };
  const edge = (c) => c.call === 'TRAP' || c.call === 'LEAN';
  const RANK = { TRAP: 2, LEAN: 1, PASS: 0, LOCK: 0 };
  const STAT = { 'Passing yards': 'passing_yards', 'Passing TDs': 'passing_tds', 'Completions': 'completions', 'Rushing yards': 'rushing_yards',
    'Carries': 'carries', 'Receptions': 'receptions', 'Receiving yards': 'receiving_yards', 'Rush + rec yards': 'rush_rec_yards', 'Touchdowns': 'total_tds' };

  let C = null, P = null, pLoading = null;
  const view = document.getElementById('view');
  const col = (t) => COLORS[t] || '#6c6c76';
  const name = (t) => NAMES[t] || t;
  const pct = (v, d = 1) => v == null ? '–' : (v * 100).toFixed(d) + '%';
  const sgn = (v, d = 1) => v == null ? '–' : (v > 0 ? '+' : '') + Number(v).toFixed(d);
  const odds = (v) => v == null ? '' : (v > 0 ? '+' : '') + Math.round(v);
  const fmtDate = (s, o = { weekday: 'short', month: 'short', day: 'numeric' }) => new Date(s + 'T12:00:00Z').toLocaleDateString('en-US', { ...o, timeZone: 'UTC' });
  const h = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);

    return n;
  };
  const go = (hash) => { location.hash = hash; };
  const sh = (title, aside) => h('div', { class: 'sh' }, h('h2', null, title), aside ? h('span', null, aside) : null);
  const kv = (items) => h('div', { class: 'kv' }, items.map(([v, k, cls]) => h('div', { class: cls || null }, h('b', null, v), h('span', null, k))));
  const facts = (rows) => h('ul', { class: 'facts' }, rows.map((f) => h('li', { 'data-t': f.tone }, f.fact)));
  const recRow = (season, market, call = 'TRAP') => C.record.find((r) => r.season === season && r.market === market && r.call === call);
  const recText = (r) => r ? `${r.wins}-${r.losses}${r.pushes ? '-' + r.pushes : ''}` : '0-0';

  // ---------- data ----------
  const games = () => {
    const by = new Map();
    for (let c of C.calls) {
      // Once a game kicks off, show the call exactly as it was locked in the live record.
      const lk = started(c.game_id) && C.ledger.find((r) => r.game_id === c.game_id && r.market === c.market);
      if (lk) c = { ...c, pick: lk.pick, line: lk.line, odds: lk.odds, popular: c.market === 'Total' ? `Over ${lk.line}` : `${lk.pick_side === c.away ? c.home : c.away} -${lk.line}` };
      const g = by.get(c.game_id) || { id: c.game_id, away: c.away, home: c.home, date: c.date, week: c.week, legs: [] };
      g.legs.push(c); by.set(c.game_id, g);
    }
    for (const g of by.values()) {
      g.legs.sort((a, b) => RANK[b.call] - RANK[a.call] || b.meter - a.meter);

    return [...by.values()].sort((a, b) => RANK[b.top.call] - RANK[a.top.call] || b.top.meter - a.top.meter || a.date.localeCompare(b.date));
  };
  const loadPlayers = () => pLoading || (pLoading = fetch('players.json').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => {
    P = d;
    P.byId = new Map(d.profiles.map((p) => [p.player_id, p]));
    P.group = (rows) => { const m = new Map(); for (const r of rows) { (m.get(r.player_id) || m.set(r.player_id, []).get(r.player_id)).push(r); } return m; };
    P.mk = P.group(d.markets); P.lg = P.group(d.logs); P.ss = P.group(d.seasons); P.fx = P.group(d.facts);
    return P;
  }));

  // ---------- slip ----------
  function meter(v) { const n = Math.round(Math.max(0, Math.min(100, v)) / 10); return h('div', { class: 'meter', 'aria-label': `Trap meter ${v} of 100` }, Array.from({ length: 10 }, (_, i) => h('i', { class: i < n ? 'on' : null }))); }
  // Moneyline plays: a TRAP underdog getting only a few points wins outright often enough that the
  // moneyline pays more than the spread (backtest in core.moneyline; cutoff in trapscore.ML_MAX_LINE).
  const mlPlay = (c) => C.moneyline && c.call === 'TRAP' && c.market === 'Spread' && c.line != null && c.line <= C.moneyline.max_line;
  function mlBox(c) {
    const M = C.moneyline, team = c.pick.split(' ')[0];
    return h('details', { class: 'mlp', onclick: (e) => e.stopPropagation() },
      h('summary', null, h('b', null, `💰 Better as moneyline: ${team}${c.ml != null ? ' ' + odds(c.ml) : ''}`),
        h('span', null, `Won outright ${pct(M.win_pct, 0)} since ${M.from} · why?`)),

  }
  function leg(c) {
    return h('div', { class: 'leg', 'data-c': c.call },
      h('div', null, h('div', { class: 'mk' }, `${c.market} · public on`), h('div', { class: 'pub' }, c.popular)),
      h('div', { class: 'score' }, h('b', null, c.meter), 'trap meter'),
      h('div', { class: 'pick', style: 'grid-column:1/-1' }, c.call === 'PASS' ? 'No trap, popular side fairly priced' : c.pick, edge(c) && c.odds != null ? h('small', null, odds(c.odds)) : null),
      meter(c.meter),
      mlPlay(c) ? mlBox(c) : null,
      edge(c) ? h('div', { class: 'sides' }, saveBtn(c, 'with'), saveBtn(c, 'fade'), logBtn(c)) : null);
  }
  function slip(g) {
    const reasons = [...new Set(g.legs.filter((c) => edge(c) && c.reasons).flatMap((c) => c.reasons.split('; ')))].slice(0, 2);
    const kick = g.info ? `${g.info.spread} · O/U ${g.info.total}` : '';
    const mv = lineMoves(g).moved;
    const legs = g.legs.filter((c) => edge(c));
    const open = () => go('g_' + g.id);
    return h('article', { class: 'slip fade', role: 'link', tabindex: 0, onclick: open, onkeydown: (e) => { if (e.key === 'Enter') open(); } },
      h('div', { class: 'bar' }, h('i', { style: `background:${col(g.away)}` }), h('i', { style: `background:${col(g.home)}` })),
      h('div', { class: 'hd' }, h('span', null, `Week ${g.week} · ${fmtDate(g.date)}`), h('span', null, kick, mv ? h('b', { class: 'mv' }, ' · moved') : null)),
      h('div', { class: 'lbadge', 'data-live-badge': `${g.away}@${g.home}`, hidden: true }),
      wxBadge(g),
      h('div', { class: 'mu' }, h('span', { class: 'chip', style: `background:${col(g.away)}` }), h('span', { class: 'tm' }, g.away), h('span', { class: 'at' }, '@'),
        h('span', { class: 'tm' }, g.home), h('span', { class: 'chip', style: `background:${col(g.home)}` }), h('span', { class: 'stamp', 'data-c': g.top.call }, LABEL[g.top.call])),
      h('div', { class: 'perf' }),
      (legs.length ? legs : [g.top]).map(leg),
      reasons.length ? h('ul', { class: 'why' }, reasons.map((r) => h('li', null, r))) : null,
      gameStats(g),
      h('div', { class: 'ft' }, h('span', null, g.info ? `${g.info.away_coach} vs ${g.info.home_coach}` : ''), h('span', null, 'Matchup →')));
  }

  // ---------- upcoming game stats (board) ----------
  const teamRow = (t) => C.teams.find((r) => r.team === t && r.season === C.meta.current_season);
  const outCount = (t, wk) => { const I = C.injuries; if (!I || I.week !== wk) return null; return (I.teams[t] || []).filter((p) => p.status === 'Out' || p.status === 'Doubtful').length; };
  function gameStats(g) {
    const u = g.info || {}, A = teamRow(g.away) || {}, Hm = teamRow(g.home) || {};
    const f1 = (v) => v == null ? '–' : Number(v).toFixed(1);
    const rows = [
      ['Record', A.su, Hm.su],
      ['Against the spread', A.ats, Hm.ats],
      ['Points scored / game', f1(A.pf_pg), f1(Hm.pf_pg)],
      ['Points allowed / game', f1(A.pa_pg), f1(Hm.pa_pg)],

  // Closing line value: did our number beat the last line before kickoff? Points first, then price at the same number.

  function seasonChart() {
    const rows = C.record.filter((r) => r.call === 'TRAP' && /^\d+$/.test(r.season) && r.market !== 'Both');
    const seasons = [...new Set(rows.map((r) => r.season))].sort();
    const W = 360, H = 190, L = 30, B = 22, T = 10;
    const ext = Math.max(5, ...rows.map((r) => Math.abs(r.units)));
    const y = (v) => T + (H - T - B) * (1 - (v + ext) / (2 * ext));
    const bw = (W - L) / Math.max(1, seasons.length);
    const NS = 'http://www.w3.org/2000/svg';
    const s = (tag, a, txt) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
    const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Units won per season by TRAP calls' });
    const step = ext > 20 ? 10 : 5;
    for (let v = -Math.floor(ext / step) * step; v <= ext; v += step) {
      svg.append(s('line', { x1: L, x2: W, y1: y(v), y2: y(v), stroke: v === 0 ? '#85858f' : '#303038' }));
      svg.append(s('text', { x: L - 5, y: y(v) + 3, 'text-anchor': 'end', 'font-size': 10, fill: '#85858f', 'font-family': 'JetBrains Mono, monospace' }, (v > 0 ? '+' : '') + v));
    }
    seasons.forEach((yr, i) => {
      ['Spread', 'Total'].forEach((m, j) => {
        const r = rows.find((x) => x.season === yr && x.market === m); if (!r) return;
        const x = L + i * bw + 2 + j * (bw - 4) / 2;
        const rect = s('rect', { x, y: y(Math.max(0, r.units)), width: Math.max(2, (bw - 4) / 2 - 1), height: Math.max(1, Math.abs(y(r.units) - y(0))), rx: 2, fill: m === 'Spread' ? '#5aa9ff' : '#f5261b' });
        rect.append(s('title', {}, `${yr} ${m}: ${r.wins}-${r.losses}, ${sgn(r.units)}u`)); svg.append(rect);
      });
      if (i % 2 === 0) svg.append(s('text', { x: L + i * bw + bw / 2, y: H - 6, 'text-anchor': 'middle', 'font-size': 10, fill: '#85858f', 'font-family': 'JetBrains Mono, monospace' }, `'${yr.slice(2)}`));
    });
    return h('div', { class: 'bars' }, svg);

  // Private to each person: data/users/<id>/bets = {items: {id: bet}, bankroll}. A bet logged from a call
  // or slip carries its legs and grades itself from the final score; a hand-entered bet is marked by its owner.

  }
  function teamTally(L, tid, wk) {
    const from = draftDay(L); let pts = 0, w = 0, l = 0, wpts = 0; const log = [];
    const wkEnd = wk ? new Date(Date.parse(wk + 'T12:00:00Z') + 6 * 864e5).toISOString().slice(0, 10) : null;
    for (const r of cbRes().values()) {
      if (r.date < from || (r.hm !== tid && r.aw !== tid)) continue;
      const g = gamePts(r, tid); pts += g.pts; g.won ? w++ : l++;
      if (wk && r.date >= wk && r.date <= wkEnd) wpts += g.pts;
      log.push({ r, ...g });
    }
    return { pts, w, l, wpts, log };
  }
  function cbLobby(L, boss) {
    const card = h('div', { class: 'card', style: 'margin-top:12px' }, h('h3', null, `Players (${CL.teams.length} of ${L.size})`),
      h('div', { class: 'plist' }, CL.teams.map((t) => h('div', { class: 'prow' }, h('span', { class: 'pos' }, t.id === L.created_by ? 'LEADER' : 'IN'),
        h('span', { class: 'nm' }, t.name, h('small', null, (CL.names[t.id] || '') + youTag(t.id))), h('span', null, '')))),
      h('p', { class: 'muted', style: 'margin:10px 0 0' }, boss ? `Share the code. When everyone is in, start the draft. Order is random, ${L.rounds || CBR} rounds. Games from draft day on count.`
        : 'Waiting for the league leader to start the draft. Keep this page open, or come back when it starts.'),
      draftTimeBox(L, CL.code, boss, clDraw, CL));
    if (boss) card.append(h('button', { class: 'save-all', onclick: () => cbStartDraft(L) }, CL.teams.length < 2 ? 'Need at least 2 players' : `Start the draft with ${CL.teams.length} players`));
    return [card];
  }
  async function cbStartDraft(L) {
    if (CL.teams.length < 2) return toast('Invite at least one friend first.');
    if (!confirm(`Start the draft now with ${CL.teams.length} players? Nobody else can join after this.`)) return;
    const order = CL.teams.map((t) => t.id);
    for (let i = order.length - 1; i > 0; i--) { const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1); [order[i], order[j]] = [order[j], order[i]]; }
    await flWrite(() => ACCT.db.doc('leagues/' + CL.code).update({ status: 'draft', order, size: order.length, draft_started_at: new Date().toISOString() })).catch(() => {});
  }
  async function cbPick(tid, auto = false) {
    const L = CL.league, n = CL.picks.length, uid = onClock(n, L.order);
    if (n >= L.order.length * (L.rounds || CBR)) return;
    if (uid !== ACCT.id && !(auto && L.created_by === ACCT.id)) return toast('Wait for your turn.');
    if (cbTaken().has(tid)) return toast('That team is already taken.');
    const ref = ACCT.db.doc(`leagues/${CL.code}/picks/p${pad3(n)}`);
    try {
      const lease = await ref.acquire({ holder: ACCT.id, ttlMs: 8000 });
      if (!lease.acquired) return toast('Someone else is making this pick. One second.');
      if ((await ref.get()).exists) return toast('That pick was just made.');
      await flWrite(() => ref.set({ n, uid, tid, at: new Date().toISOString(), by: ACCT.id, auto }));
      // Last pick: mark the league in season (only the creator can write the league doc on the website; the page works either way).
      if (n + 1 >= L.order.length * (L.rounds || CBR)) ACCT.db.doc('leagues/' + CL.code).update({ status: 'season', draft_done_at: new Date().toISOString() }).catch(() => {});
    } catch (e) { /* toast already shown */ }
  }
  function cbDraftView(L, boss, member) {
    const R = L.rounds || CBR, T = L.order.length, n = CL.picks.length, uid = onClock(n, L.order), mine = uid === ACCT.id;
    const clock = h('div', { class: 'card', style: `margin-top:12px;border-color:${mine ? 'var(--yel)' : 'var(--line)'}` },
      h('h3', null, mine ? 'You are on the clock' : `${clName(uid)} is picking`),
      h('p', { class: 'muted', style: 'margin:-4px 0 0' }, `Round ${Math.floor(n / T) + 1} of ${R} · pick ${n + 1} of ${T * R}`),
      boss && !mine ? h('button', { class: 'gbtn alt', style: 'margin-top:10px;padding:10px 14px', onclick: () => {
        const t = CB.teams.filter((x) => !cbTaken().has(x.id)).sort((a, b) => a.rank - b.rank)[0];
        if (t && confirm(`Auto-pick ${t.name} for ${clName(uid)}?`)) cbPick(t.id, true); } }, `Auto-pick for ${clName(uid)}`) : null);
    const my = cbRoster(ACCT.id).map((id) => CB.byId.get(id)).filter(Boolean);
    const roster = member ? h('details', { class: 'card', 'data-k': 'roster' }, h('summary', null, `Your teams (${my.length} of ${R})`),
      my.length ? h('div', { class: 'plist' }, my.map((t) => h('div', { class: 'prow' }, h('span', { class: 'pos' }, t.abbr), h('span', { class: 'nm' }, t.name), h('span', { class: 'pr' }, '#' + t.rank)))) : h('p', { class: 'muted' }, 'No teams yet.')) : null;
    const inp = CL.search || (CL.search = h('input', { class: 'search', type: 'search', placeholder: 'Search available teams', 'aria-label': 'Search available teams', style: 'margin:0 0 10px' }));
    if (!inp.dataset.wired) { inp.dataset.wired = 1; inp.addEventListener('input', () => { CL.q = inp.value; clDraw(); }); }
    const tk = cbTaken(), q = CL.q.trim().toLowerCase();
    const avail = CB.teams.filter((t) => !tk.has(t.id) && (!q || t.name.toLowerCase().includes(q) || (t.abbr || '').toLowerCase() === q)).sort((a, b) => a.rank - b.rank).slice(0, 60);
    const list = h('div', { class: 'plist' }, avail.map((t) => h('div', { class: 'frow', style: `--tc:${t.color};grid-template-columns:34px auto 1fr auto` },
      h('span', { class: 'rk' }, t.rank), h('span', { class: 'pos' }, t.abbr),
      h('span', { class: 'nm' }, t.short || t.name, h('small', null, `${sgn(t.rating)} rating · ${t.gp ? t.rec + ' this season' : t.rec_last + ' last season'}`)),
      mine ? h('button', { class: 'gbtn', style: 'padding:8px 12px', onclick: () => { if (confirm(`Draft ${t.name}?`)) cbPick(t.id); } }, 'Draft') : h('span', { class: 'vl' }, ''))));
    const board = h('details', { class: 'card', 'data-k': 'board' }, h('summary', null, `Draft board (${n} picks)`),
      h('div', { class: 'plist' }, [...CL.picks].reverse().slice(0, 40).map((pk) => { const t = CB.byId.get(pk.tid); return h('div', { class: 'prow' },
        h('span', { class: 'pos' }, `${Math.floor(pk.n / T) + 1}.${pk.n % T + 1}`), h('span', { class: 'nm' }, t ? t.name : 'Team', h('small', null, clName(pk.uid) + (pk.auto ? ' · auto' : ''))), h('span', { class: 'pr' }, t ? '#' + t.rank : '')); })));
    return [clock, roster, h('div', { class: 'card' }, h('h3', null, 'Available teams'), h('p', { class: 'muted', style: 'margin:-4px 0 10px;font-size:12.5px' }, 'Ranked by our power ratings.'), inp, list), board];
  }
  function cbSeasonView(L) {
    const wk = cbMonday();
    const rows = L.order.map((u) => { const ts = cbRoster(u).map((tid) => ({ tid, ...teamTally(L, tid, wk) }));
      return { u, ts, pts: ts.reduce((a, t) => a + t.pts, 0), wpts: ts.reduce((a, t) => a + t.wpts, 0), w: ts.reduce((a, t) => a + t.w, 0), l: ts.reduce((a, t) => a + t.l, 0) }; })
      .sort((a, b) => (b.pts - a.pts) || (b.wpts - a.wpts));
    const anyGames = rows.some((r) => r.w + r.l);
    const standings = h('div', { class: 'card', style: 'margin-top:12px' }, h('h3', null, 'Standings'), h('table', { class: 'tbl' },
      h('tr', null, h('th', null, 'Player'), h('th', null, 'W-L'), h('th', null, 'Week'), h('th', null, 'Pts')),
      rows.map((r) => h('tr', null, h('td', { style: 'font-family:var(--body)' }, clName(r.u) + youTag(r.u)), h('td', null, `${r.w}-${r.l}`), h('td', null, r.wpts), h('td', null, h('b', null, r.pts))))),
      h('p', { class: 'muted', style: 'margin:10px 0 0;font-size:12.5px' }, anyGames ? `Win ${CBP.win} · road win +${CBP.road} · upset +${CBP.upset} · by 20+ +${CBP.blowout}. Division I games since the draft. "Week" is Monday to Sunday.`
        : `Points start with the first game after the draft. The season tips off ${fmtDate(CB.meta.first_game, { month: 'short', day: 'numeric' })}. Win ${CBP.win} · road win +${CBP.road} · upset +${CBP.upset} · by 20+ +${CBP.blowout}.`));
    const rosters = rows.map((r) => h('details', { class: 'card', 'data-k': 'r_' + r.u, open: r.u === ACCT.id ? true : null }, h('summary', null, `${clName(r.u)}${youTag(r.u)} · ${r.pts} pts`),
      h('div', { class: 'plist' }, r.ts.sort((a, b) => b.pts - a.pts).map((t) => { const x = CB.byId.get(t.tid) || {}; const last = t.log[t.log.length - 1];
        return h('button', { class: 'prow', onclick: () => go('c_' + t.tid) }, h('span', { class: 'pos' }, x.abbr || ''),
          h('span', { class: 'nm' }, x.name || 'Team', h('small', null, last ? `${t.w}-${t.l} · last: ${last.won ? 'W' : 'L'} vs ${tShort(last.r.hm === t.tid ? last.r.aw : last.r.hm)}${last.tags.length ? ' (' + last.tags.join(', ') + ')' : ''}` : `#${x.rank} in our ratings · no games yet`)),
          h('span', { class: 'pr' }, t.pts, h('small', null, 'pts'))); }))));
    return [standings, ...rosters];
  }

  // ---------- games in this group ----------
  // One crew, several games: any NFL group, NBA league or college league can add more games for the same friends.
  // links/<family>/games/<code> lists them (family = the code of the first one); each new game stores family too.
  const GAME_KINDS = {
    nfl: { label: 'NFL pick\'em', sport: '🏈', path: 'grp_' },
    draft: { label: 'NBA fantasy draft', sport: '🏀', path: 'fl_' }, late: { label: 'NBA Late to the Party', sport: '🏀', path: 'fl_' }, weekly: { label: 'NBA weekly lineups', sport: '🏀', path: 'fl_' },
    cbb_pickem: { label: 'College pick\'em', sport: '🎓', path: 'cbbp_' }, cbb_draft: { label: 'College team draft', sport: '🎓', path: 'cbbp_' },
  };
  const ADDABLE = ['nfl', 'draft', 'weekly', 'cbb_pickem', 'cbb_draft'];
  const FAM = { cache: {} };
  const inGame = (g) => g.kind === 'nfl' ? ACCT.groups.includes(g.code) : /^cbb_/.test(g.kind) ? ACCT.cbb.includes(g.code) : ACCT.leagues.includes(g.code);
  async function linkGame(fam, home, code, kind, name) {
    const base = 'links/' + fam + '/games/';
    if (home && !(await ACCT.db.doc(base + fam).get()).exists) await ACCT.db.doc(base + fam).set({ code: fam, kind: home.kind, name: home.name, at: new Date().toISOString(), by: ACCT.id });
    await ACCT.db.doc(base + code).set({ code, kind, name, at: new Date().toISOString(), by: ACCT.id });
    delete FAM.cache[fam];
  }
  async function addGame(fam, home, kind) {
    if (ACCT.state !== 'ready') return toast(signIn('add a game'));
    const nm = home.name;
    if (!confirm(`Add ${GAME_KINDS[kind].label} for "${nm}"? Everyone in the group gets a one-tap join.`)) return;
    const done = (code) => code && linkGame(fam, home, code, kind, nm).catch(() => {});
    if (kind === 'nfl') return createGroup(nm, fam, done);
    if (/^cbb_/.test(kind)) return loadCbb().then(() => cbCreate(nm, kind, 8, fam, done));
    return loadFantasy().then(() => createLeague(nm, kind, 8, fam, done));
  }
  async function joinGame(g) {
    if (g.kind === 'nfl') return joinGroup(g.code);
    if (/^cbb_/.test(g.kind)) return loadCbb().then(() => cbJoin(g.code));
    return loadFantasy().then(() => joinLeague(g.code));
  }
  // home: { code, kind, name, family } for the page being shown.
  function gamesCard(home) {
    if (ACCT.state !== 'ready' && ACCT.state !== 'readonly') return null;
    const fam = home.family || home.code;
    const card = h('div', { class: 'card gm' }, h('h3', null, 'Games in this group'), h('div', { class: 'loading', style: 'padding:8px 0' }, 'Loading…'));
    const load = FAM.cache[fam] || (FAM.cache[fam] = ACCT.db.collection('links/' + fam + '/games').get().then((s) => s.docs.map((d) => d.data())));
    load.then((list) => {
      if (!list.some((g) => g.code === home.code)) list = [{ code: home.code, kind: home.kind, name: home.name }, ...list];
      const have = new Set(list.map((g) => g.kind === 'late' ? 'draft' : g.kind));
      const rows = h('div', { class: 'plist' }, list.map((g) => { const K = GAME_KINDS[g.kind] || { label: 'Game', sport: '🎮', path: 'fl_' }, here = g.code === home.code, mine = inGame(g);
        return h('div', { class: 'prow' }, h('span', { class: 'gm-i' }, K.sport), h('span', { class: 'nm' }, K.label, h('small', null, here ? 'You are here' : mine ? 'You are in' : 'Not joined yet')),
          here ? h('span', null, '') : mine ? h('button', { class: 'gbtn alt', onclick: () => go(K.path + g.code) }, 'Open') : h('button', { class: 'gbtn', onclick: () => joinGame(g) }, 'Join')); }));
      // Only the group leader adds games: whoever made the first game (or added the first link).
      const root = list.find((g) => g.code === fam);
      const leader = home.created_by === ACCT.id && (!root || !root.by || root.by === ACCT.id);
      const add = leader ? ADDABLE.filter((k) => !have.has(k)) : [];
      card.replaceChildren(h('h3', null, 'Games in this group'), rows,
        add.length ? h('details', { class: 'gm-add', open: FAM.open === home.code ? true : null, ontoggle: (e) => { FAM.open = e.currentTarget.open ? home.code : null; } }, h('summary', null, '+ Add a game for this group'),
          h('p', { class: 'muted', style: 'margin:6px 0 8px;font-size:12.5px' }, 'Same name, new game. Friends see it here and join with one tap, no new code to share. Only you, the leader, can add games.'),
          h('div', { class: 'gm-btns' }, add.map((k) => h('button', { onclick: () => addGame(fam, home, k) }, GAME_KINDS[k].sport + ' ' + GAME_KINDS[k].label)))) : null);
    }).catch(() => card.replaceChildren(h('h3', null, 'Games in this group'), h('p', { class: 'muted' }, 'Could not load the group\'s games.')));
    return card;
  }

  function route() {
    if (!C) return;
    const hash = location.hash.slice(1) || 'board';
    const [kind, ...rest] = hash.split('_'); const arg = rest.join('_');
    let tab = 'board', nodes;
    if (hash === 'teams') { tab = 'teams'; nodes = teams(); }
    else if (hash === 'players') { tab = 'players'; nodes = players(); }
    else if (hash === 'record') { tab = 'record'; nodes = record(); }
    else if (hash === 'me') { tab = 'me'; nodes = mePage(); }
    else if (hash === 'bets') { tab = 'me'; nodes = betsPage(); }
    else if (hash === 'login') { tab = 'me'; nodes = loginPage(); }
    else if (hash === 'fantasy') { tab = 'fantasy'; nodes = fantasy(); }
    else if (hash === 'sports') { tab = null; nodes = sportsPage(); }
    else if (hash === 'nba') { tab = 'nba'; nodes = nbaHome(); }
    else if (hash === 'cbb') { tab = 'cbb'; nodes = cbbGames(); }
    else if (hash === 'cbbt') { tab = 'cbbt'; nodes = cbbRank(); }
    else if (kind === 'c') { tab = 'cbbt'; nodes = cbbTeam(arg); }
    else if (hash === 'cbbp') { tab = 'cbbp'; nodes = cbbPlay(); }
    else if (kind === 'cbbp') { tab = 'cbbp'; nodes = cbLeaguePage(arg); }
    else if (kind === 'f') { tab = 'fantasy'; nodes = fplayer(arg); }
    else if (hash === 'fl') { tab = 'fl'; nodes = leaguesHome(); }
    else if (kind === 'fl') { tab = 'fl'; nodes = leaguePage(arg); }
    else if (kind === 'grp') { tab = 'me'; nodes = groupPage(arg); }
    else if (kind === 'g') nodes = game(arg);
    else if (kind === 't') { tab = 'teams'; nodes = team(arg); }
    else if (kind === 'p') { tab = 'players'; nodes = player(arg); }
    else nodes = board();
    if (!(kind === 'fl' && arg) && FL.code) flStop();
    if (!(kind === 'cbbp' && arg) && CL.code) clStop();
    if (kind !== 'grp' && GROUP.unsub) { GROUP.unsub(); GROUP.unsub = null; GROUP.code = null; }
    const detail = (['g', 't', 'p', 'grp', 'f', 'fl', 'c', 'cbbp'].includes(kind) && arg) || hash === 'bets';
    // The sport follows the page: NBA pages switch the tab bar to NBA, NFL pages to NFL; shared pages keep the current one.
    if (['nba', 'fantasy', 'fl'].includes(hash) || kind === 'f' || kind === 'fl') setSport('nba');
    else if (['cbb', 'cbbt', 'cbbp'].includes(hash) || kind === 'c' || kind === 'cbbp') setSport('ncaab');
    else if (!['sports', 'me', 'bets', 'login'].includes(hash) && kind !== 'grp') setSport('nfl');
    document.getElementById('back').hidden = !detail;
    document.querySelectorAll('.tabbar a').forEach((a) => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    view.replaceChildren(...[nodes].flat(3).filter(Boolean));
    window.scrollTo(0, 0);
    renderLive();
    renderWx();
    boardTick();
    if (hash !== 'me') sync();
  }
  document.getElementById('acct').addEventListener('click', () => go(HOSTED && (ACCT.state === 'ready' || ACCT.state === 'readonly') ? 'me' : 'login'));
  document.getElementById('back').addEventListener('click', () => { if (history.length > 1) history.back(); else go('board'); });
  window.addEventListener('hashchange', route);

  fetch('core.json').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => {
    C = d;
    const g = new Date(C.meta.generated);
    document.getElementById('updT').textContent = `Updated ${g.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} ${g.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`;
    document.getElementById('sport').addEventListener('click', () => go('sports'));
    setSport(SPORT);
    route();
    pushInit();
    Promise.resolve(initAccount()).then(pushSync, () => {});
    Promise.all(['nfl', 'nba'].map(pollLive)).then(liveLoop);
  }).catch(() => { view.replaceChildren(h('p', { class: 'muted', style: 'padding:40px 0;text-align:center' }, 'The board failed to load. Pull to refresh.')); });
})();
</script>
<script>
(() => {
  const city = document.createElement('div'); city.id = 'city';
  city.innerHTML = '<div class="win w1"></div><div class="win w2"></div><div class="win w3"></div><div class="shade"></div>';
  document.body.prepend(city);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let on = false;
  const drift = () => { on = false; city.style.transform = `translate3d(0, ${-Math.min(window.scrollY * 0.06, window.innerHeight * 0.08)}px, 0)`; };
  addEventListener('scroll', () => { if (!on) { on = true; requestAnimationFrame(drift); } }, { passive: true });
})();
</script>
