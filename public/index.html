<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Trap Picks</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1324">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<meta name="description" content="Trap Picks: NFL betting information. Where the popular side loses, live scores and win chances, and fantasy basketball.">
<script>window.TRAP_API = "/api";</script>
</head><body>
<style>
/* One deliberate theme: stadium at night. Navy field, floodlight yellow, trap red. */
:root {
  color-scheme: dark;
  --bg: #0b1324; --bg2: #101b33; --card: #15223f; --card2: #1b2a4d; --line: #27385f;
  --ink: #eef2fb; --ink2: #a9b6d3; --ink3: #7182a8;
  --yel: #ffd23f; --red: #ff4d5e; --grn: #3ddc97; --blu: #5aa9ff; --org: #ff9f43;
  --paper: #f6f1e4; --paper-ink: #1a1d29; --paper-line: #d9cfb8;
  --disp: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --body: 'Barlow', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; overflow-x: hidden;
  background: radial-gradient(900px 420px at 50% -120px, #1d3566 0%, transparent 70%), var(--bg); background-attachment: fixed; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top); z-index: 20; margin: 0 -16px; padding: 10px 16px;
  background: rgba(11,19,36,.86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; }
.back { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--card); flex: none; }
.back[hidden] { display: none; }
.mark { font-family: var(--disp); font-weight: 900; font-size: 26px; letter-spacing: .02em; line-height: 1; text-transform: uppercase; }
.mark b { color: var(--yel); }
.top .sub { margin-left: auto; font-size: 12px; color: var(--ink3); text-align: right; line-height: 1.25; }

/* Hero */
.hero { position: relative; margin: 18px 0 8px; padding: 20px 18px 18px; border-radius: 20px; overflow: hidden;
  background: linear-gradient(160deg, #1a2c55, #0f1a33 70%); border: 1px solid var(--line); }
.hero::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
  background: repeating-linear-gradient(-45deg, var(--yel) 0 12px, #111 12px 24px); opacity: .9; }
.hero h1 { font-family: var(--disp); font-weight: 900; font-size: clamp(44px, 13vw, 76px); line-height: .86; margin: 0; text-transform: uppercase; letter-spacing: .01em; }
.hero h1 span { color: var(--yel); display: block; }
.hero p { margin: 10px 0 14px; color: var(--ink2); font-size: 15px; max-width: 34ch; }
.ribbon { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.pill { display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 11px; border-radius: 999px; background: rgba(255,255,255,.07); font-size: 13px; color: var(--ink2); }
.pill b { font-family: var(--mono); color: var(--ink); font-size: 14px; }
.pill.hot b { color: var(--yel); }

.steps { list-style: none; margin: 14px 0 12px; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; font-size: 16px; line-height: 1.35; }
.steps b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--yel); color: #1a1600; font-family: var(--disp); font-weight: 900; font-size: 17px; }
.steps em { font-style: normal; font-weight: 700; color: var(--yel); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.keys div { display: grid; justify-items: start; gap: 5px; padding: 9px; border-radius: 10px; background: rgba(255,255,255,.06); font-size: 13px; color: var(--ink2); }
.hero .meter-key { margin: 0 0 6px; font-size: 13.5px; color: var(--ink2); }
.hero .meter-key b { color: var(--ink); }
.hero .hero-count { margin: 0 0 12px; font-family: var(--disp); font-weight: 800; font-size: 20px; text-transform: uppercase; color: var(--yel); }

/* Section heads */
.sh { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 2px 10px; }
.sh h2 { font-family: var(--disp); font-weight: 800; font-size: 26px; text-transform: uppercase; margin: 0; letter-spacing: .02em; }
.sh span { color: var(--ink3); font-size: 13px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink2); margin: -2px 2px 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Betting slip ticket */
.slip { position: relative; display: block; width: 100%; text-align: left; margin: 0 0 14px; border-radius: var(--r); background: var(--paper); color: var(--paper-ink);
  box-shadow: 0 10px 28px rgba(0,0,0,.35); overflow: hidden; }
.slip:active { transform: scale(.99); }
.slip .bar { display: flex; height: 8px; }
.slip .bar i { flex: 1; }
.slip .hd { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #6b6655; }
.slip .mu { display: flex; align-items: center; gap: 10px; padding: 6px 14px 12px; }
.slip .tm { font-family: var(--disp); font-weight: 900; font-size: 34px; line-height: 1; }
.slip .at { color: #9a937f; font-weight: 700; }
.chip { width: 14px; height: 30px; border-radius: 4px; flex: none; }
.stamp { margin-left: auto; font-family: var(--disp); font-weight: 900; font-size: 22px; letter-spacing: .08em; padding: 2px 10px; border: 3px solid currentColor; border-radius: 6px; transform: rotate(-6deg); }
.stamp[data-c=TRAP] { color: #d81f33; }
.stamp[data-c=LEAN] { color: #c27a00; }
.stamp[data-c=PASS] { color: #8b8673; border-width: 2px; font-size: 18px; }
.perf { height: 0; border-top: 2px dashed var(--paper-line); margin: 0 10px; position: relative; }
.perf::before, .perf::after { content: ''; position: absolute; top: -10px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); }
.perf::before { left: -19px; } .perf::after { right: -19px; }
.leg { padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.leg + .leg { border-top: 1px solid var(--paper-line); }
.leg .mk { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #6b6655; }
.leg .pub { font-family: var(--mono); font-size: 13px; color: #8b8673; text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: rgba(216,31,51,.7); }
.leg .pick { font-family: var(--disp); font-weight: 800; font-size: 26px; line-height: 1; }
.leg .pick small { font-family: var(--mono); font-size: 13px; font-weight: 500; color: #6b6655; margin-left: 6px; }
.leg[data-c=PASS] .pick { font-size: 18px; color: #6b6655; }
.leg .score { text-align: right; font-family: var(--mono); font-size: 12px; color: #6b6655; }
.leg .score b { display: block; font-size: 22px; color: var(--paper-ink); }
.meter { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin-top: 4px; }
.meter i { height: 7px; border-radius: 2px; background: #e4dccb; }
.meter i.on { background: #e8a400; }
.leg[data-c=TRAP] .meter i.on { background: #d81f33; }
.why { list-style: none; margin: 0; padding: 0 14px 12px; display: grid; gap: 4px; }
.why li { font-size: 13.5px; color: #4a4638; padding-left: 16px; position: relative; }
.why li::before { content: ''; position: absolute; left: 2px; top: 7px; width: 6px; height: 6px; background: #d81f33; transform: rotate(45deg); }
.slip .ft { display: flex; justify-content: space-between; padding: 9px 14px; background: #efe8d6; font-size: 13px; font-weight: 600; color: #4a4638; }
.slip .ft .mono { font-weight: 700; }

/* Slip of the day: a long receipt */
.sod { position: relative; margin: 18px 0 4px; padding: 16px 16px 14px; border-radius: 6px; background: var(--paper); color: var(--paper-ink);
  box-shadow: 0 12px 30px rgba(0,0,0,.4); transform: rotate(-.6deg);
  -webkit-mask: radial-gradient(circle 7px at 50% 0, transparent 98%, #000) 0 0 / 18px 51% repeat-x, radial-gradient(circle 7px at 50% 100%, transparent 98%, #000) 0 100% / 18px 51% repeat-x;
  mask: radial-gradient(circle 7px at 50% 0, transparent 98%, #000) 0 0 / 18px 51% repeat-x, radial-gradient(circle 7px at 50% 100%, transparent 98%, #000) 0 100% / 18px 51% repeat-x; }
.sod-hd { display: grid; gap: 4px; padding: 6px 0 10px; border-bottom: 2px dashed var(--paper-line); }
.sod-hd b { font-family: var(--disp); font-weight: 900; font-size: 30px; text-transform: uppercase; line-height: 1; color: #d81f33; }
.sod-hd span { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #6b6655; }
.sod-n { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 12px 0 6px; }
.sod-n button { width: 44px; height: 44px; border-radius: 50%; background: var(--paper-ink); color: var(--paper); font-size: 24px; font-weight: 700; }
.sod-n button:disabled { opacity: .25; cursor: default; }
.sod-n div { text-align: center; min-width: 64px; }
.sod-n b { display: block; font-family: var(--disp); font-weight: 900; font-size: 44px; line-height: .9; }
.sod-n span { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6b6655; }
.sod-legs { list-style: none; margin: 6px 0 0; padding: 0; counter-reset: leg; }
.sod-legs li + li { border-top: 1px solid var(--paper-line); }
.sod-legs button { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 0; text-align: left; color: var(--paper-ink); }
.sod-legs .sl b { display: block; font-family: var(--disp); font-weight: 800; font-size: 21px; line-height: 1.05; }
.sod-legs .sl small { font-size: 12px; color: #6b6655; }
.sod-legs .mono { font-size: 14px; font-weight: 700; }
.sod-legs .tag { min-width: 64px; text-align: center; }
.sod-tot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; padding-top: 12px; border-top: 2px dashed var(--paper-line); text-align: center; }
.sod-tot span { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #6b6655; }
.sod-tot b { font-size: 19px; }
.sod-note { margin: 12px 0 4px; font-size: 13px; line-height: 1.45; color: #4a4638; }

/* Groups */
.gform { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
.gbtn { padding: 0 16px; border-radius: 12px; background: var(--yel); color: #1a1600; font-weight: 800; }
.gbtn.alt { background: var(--card2); color: var(--ink); }
.grph { margin: 16px 0 12px; padding: 18px 16px; border-radius: 20px; background: linear-gradient(150deg, #3b2a00, #1c1503); border: 1px solid #6b5100; }
.grph > span { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--yel); }
.grph > b { display: block; font-family: var(--disp); font-weight: 900; font-size: 40px; line-height: 1; text-transform: uppercase; margin: 4px 0 12px; }
.gcode { display: flex; align-items: center; gap: 10px; }
.gcode .mono { font-size: 24px; font-weight: 700; letter-spacing: .18em; padding: 6px 12px; border-radius: 10px; background: rgba(0,0,0,.35); }
.gcode button { padding: 10px 14px; border-radius: 999px; background: var(--yel); color: #1a1600; font-weight: 800; font-size: 14px; }
details.lb { border-top: 1px solid var(--line); }
details.lb:first-of-type { border-top: 0; }
details.lb summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 22px 36px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; }
details.lb summary::-webkit-details-marker { display: none; }
.lb .rk { font-family: var(--disp); font-weight: 900; font-size: 22px; color: var(--yel); text-align: center; }
.lb img { width: 36px; height: 36px; border-radius: 50%; background: var(--card2); }
.lb .nm { font-weight: 700; }
.lb .nm small { display: block; font-weight: 400; font-size: 12px; color: var(--ink3); }
.lb .u { text-align: right; font-size: 12px; color: var(--ink2); }
.lb .u b { display: block; font-size: 17px; color: var(--ink); }
.leave { display: block; margin: 8px auto 0; padding: 10px 16px; color: var(--ink3); font-size: 14px; text-decoration: underline; }

/* Account */
.leg .sides { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.leg .sides .save { margin-top: 0; }
.save.fade { border-color: #d81f33; color: #d81f33; }
.save.fade.on { background: #d81f33; color: #fff; }
.tag.FADE { background: var(--blu); color: #06172e; }
.slip { cursor: pointer; }
.save { grid-column: 1 / -1; justify-self: start; margin-top: 6px; padding: 7px 12px; border-radius: 999px; border: 2px solid var(--paper-ink); font-size: 13px; font-weight: 700; color: var(--paper-ink); }
.save.on { background: var(--paper-ink); color: var(--paper); }
.save-all { display: block; width: 100%; margin-top: 8px; padding: 12px; border-radius: 10px; background: #d81f33; color: #fff; font-family: var(--disp); font-weight: 800; font-size: 18px; text-transform: uppercase; letter-spacing: .04em; }
.follow { position: absolute; right: 12px; top: 12px; z-index: 1; padding: 7px 12px; border-radius: 999px; background: rgba(0,0,0,.35); color: #fff; font-size: 13px; font-weight: 700; }
.follow.on { background: var(--yel); color: #1a1600; }
[hidden] { display: none !important; }
.meh { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.meh img { width: 48px; height: 48px; border-radius: 50%; background: var(--card); }
.meh b { display: block; font-family: var(--disp); font-weight: 800; font-size: 26px; text-transform: uppercase; }
.meh span { font-size: 13px; color: var(--ink3); }
.lg .x { width: 30px; height: 30px; border-radius: 8px; background: var(--card2); font-size: 18px; }
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 40; max-width: 480px; margin: 0 auto; padding: 12px 14px; border-radius: 12px;
  background: var(--paper); color: var(--paper-ink); font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; }
#toast.show { opacity: 1; transform: none; }

/* Pass row */
.passes { display: flex; flex-wrap: wrap; gap: 8px; }
.passes button { display: inline-flex; align-items: center; gap: 7px; padding: 9px 12px; border-radius: 10px; background: var(--card); font-size: 14px; font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* Dark cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 10px; font-family: var(--disp); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.kv div { background: var(--bg2); border-radius: 10px; padding: 10px; }
.kv b { display: block; font-family: var(--mono); font-size: 19px; font-weight: 700; }
.kv span { font-size: 12px; color: var(--ink3); }
.kv .good b { color: var(--grn); } .kv .bad b { color: var(--red); } .kv .hot b { color: var(--yel); }
.muted { color: var(--ink3); font-size: 14px; }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.facts li { padding: 10px 12px 10px 14px; border-radius: 10px; background: var(--bg2); font-size: 14.5px; line-height: 1.4; border-left: 3px solid var(--ink3); }
.facts li[data-t=good] { border-left-color: var(--grn); } .facts li[data-t=bad] { border-left-color: var(--red); }

/* Game sheet */
.gh { margin: 16px 0 12px; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); }
.gh .sides { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; }
.gh .side { padding: 16px 14px; color: #fff; position: relative; }
.gh .side.h { text-align: right; }
.gh .side .ab { font-family: var(--disp); font-weight: 900; font-size: 48px; line-height: .9; }
.gh .side .nm { font-size: 13px; opacity: .9; }
.gh .side .rec { font-family: var(--mono); font-size: 12px; opacity: .85; margin-top: 6px; }
.gh .vs { display: grid; place-items: center; padding: 0 6px; background: var(--bg2); font-family: var(--disp); font-weight: 800; color: var(--ink3); }
.gh .lines { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); }
.gh .lines div { padding: 10px; text-align: center; border-right: 1px solid var(--line); }
.gh .lines div:last-child { border-right: 0; }
.gh .lines b { display: block; font-family: var(--mono); font-size: 17px; }
.gh .lines span { font-size: 11px; color: var(--ink3); text-transform: uppercase; letter-spacing: .08em; }
.fair { display: flex; height: 26px; border-radius: 8px; overflow: hidden; font-family: var(--mono); font-size: 12px; font-weight: 700; color: #fff; }
.fair i { display: flex; align-items: center; padding: 0 8px; font-style: normal; min-width: 0; }
.fair i + i { justify-content: flex-end; }
.coach { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.coach div:last-child { text-align: right; }
.coach b { display: block; font-size: 16px; }
.coach span { font-size: 12px; color: var(--ink3); }
.coach .x { font-family: var(--disp); font-weight: 800; color: var(--yel); font-size: 18px; }
.plist { display: grid; gap: 6px; }
.prow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; background: var(--bg2); text-align: left; width: 100%; }
.prow .pos { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 3px 6px; border-radius: 5px; background: var(--card2); color: var(--ink2); }
.prow .nm { font-weight: 600; font-size: 15px; }
.prow .nm small { display: block; font-weight: 400; color: var(--ink3); font-size: 12px; }
.prow .pr { font-family: var(--mono); font-size: 14px; font-weight: 700; text-align: right; }
.prow .pr small { display: block; font-size: 10px; color: var(--ink3); font-weight: 500; }
.out { color: var(--red); }

/* Teams grid */
.search { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 16px; margin: 14px 0 12px; }
.search::placeholder { color: var(--ink3); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tt { position: relative; text-align: left; padding: 12px; border-radius: 12px; background: var(--card); overflow: hidden; border: 1px solid var(--line); }
.tt::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--tc); }
.tt .ab { font-family: var(--disp); font-weight: 900; font-size: 30px; line-height: 1; }
.tt .nm { font-size: 12px; color: var(--ink2); margin: 2px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt .st { display: flex; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.tt .st b { color: var(--ink); }
.tabs2 { display: flex; gap: 6px; margin: 0 0 12px; overflow-x: auto; scrollbar-width: none; }
.tabs2 button { padding: 8px 12px; border-radius: 999px; background: var(--card); font-size: 14px; font-weight: 600; white-space: nowrap; color: var(--ink2); }
.tabs2 button[aria-pressed=true] { background: var(--yel); color: #1a1600; }

/* Team header */
.th { margin: 16px 0 12px; border-radius: 20px; padding: 18px 16px; color: #fff; position: relative; overflow: hidden; }
.th .ab { font-family: var(--disp); font-weight: 900; font-size: 64px; line-height: .85; }
.th .nm { font-size: 17px; font-weight: 600; }
.th .co { font-size: 13px; opacity: .9; margin-top: 4px; }
.th .big { position: absolute; right: -10px; bottom: -28px; font-family: var(--disp); font-weight: 900; font-size: 150px; opacity: .14; line-height: 1; }
.sched { display: grid; gap: 4px; }
.sg { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 9px; background: var(--bg2); font-size: 14px; }
.sg .wk { font-family: var(--mono); font-size: 12px; color: var(--ink3); }
.sg .op { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.sg .op small { color: var(--ink3); font-weight: 400; }
.res { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-family: var(--mono); font-size: 12px; font-weight: 700; color: #08111f; }

<script>
(() => {
  'use strict';
  const COLORS = { ARI: '#b3264a', ATL: '#c8102e', BAL: '#5b3fb5', BUF: '#1d5fd6', CAR: '#0085ca', CHI: '#e0581f', CIN: '#fb4f14',

    CIN: 'Cincinnati Bengals', CLE: 'Cleveland Browns', DAL: 'Dallas Cowboys', DEN: 'Denver Broncos', DET: 'Detroit Lions', GB: 'Green Bay Packers', HOU: 'Houston Texans',
    IND: 'Indianapolis Colts', JAX: 'Jacksonville Jaguars', KC: 'Kansas City Chiefs', LV: 'Las Vegas Raiders', LAC: 'Los Angeles Chargers', LA: 'Los Angeles Rams',
    MIA: 'Miami Dolphins', MIN: 'Minnesota Vikings', NE: 'New England Patriots', NO: 'New Orleans Saints', NYG: 'New York Giants', NYJ: 'New York Jets',
    PHI: 'Philadelphia Eagles', PIT: 'Pittsburgh Steelers', SF: 'San Francisco 49ers', SEA: 'Seattle Seahawks', TB: 'Tampa Bay Buccaneers', TEN: 'Tennessee Titans',
    WAS: 'Washington Commanders' };

  const RANK = { TRAP: 2, LEAN: 1, PASS: 0 };
  const STAT = { 'Passing yards': 'passing_yards', 'Passing TDs': 'passing_tds', 'Completions': 'completions', 'Rushing yards': 'rushing_yards',
    'Carries': 'carries', 'Receptions': 'receptions', 'Receiving yards': 'receiving_yards', 'Rush + rec yards': 'rush_rec_yards', 'Touchdowns': 'total_tds' };

  let C = null, P = null, pLoading = null;
  const view = document.getElementById('view');
  const col = (t) => COLORS[t] || '#5a6b91';
  const name = (t) => NAMES[t] || t;
  const pct = (v, d = 1) => v == null ? '–' : (v * 100).toFixed(d) + '%';
  const sgn = (v, d = 1) => v == null ? '–' : (v > 0 ? '+' : '') + Number(v).toFixed(d);
  const odds = (v) => v == null ? '' : (v > 0 ? '+' : '') + Math.round(v);
  const fmtDate = (s, o = { weekday: 'short', month: 'short', day: 'numeric' }) => new Date(s + 'T12:00:00Z').toLocaleDateString('en-US', { ...o, timeZone: 'UTC' });
  const h = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);

  };
  const go = (hash) => { location.hash = hash; };
  const sh = (title, aside) => h('div', { class: 'sh' }, h('h2', null, title), aside ? h('span', null, aside) : null);
  const kv = (items) => h('div', { class: 'kv' }, items.map(([v, k, cls]) => h('div', { class: cls || null }, h('b', null, v), h('span', null, k))));
  const facts = (rows) => h('ul', { class: 'facts' }, rows.map((f) => h('li', { 'data-t': f.tone }, f.fact)));
  const recRow = (season, market, call = 'TRAP') => C.record.find((r) => r.season === season && r.market === market && r.call === call);
  const recText = (r) => r ? `${r.wins}-${r.losses}${r.pushes ? '-' + r.pushes : ''}` : '0-0';

  // ---------- data ----------
  const games = () => {
    const by = new Map();
    for (let c of C.calls) {
      // Once a game kicks off, show the call exactly as it was locked in the live record.
      const lk = started(c.game_id) && C.ledger.find((r) => r.game_id === c.game_id && r.market === c.market);
      if (lk) c = { ...c, pick: lk.pick, line: lk.line, odds: lk.odds, popular: c.market === 'Total' ? `Over ${lk.line}` : `${lk.pick_side === c.away ? c.home : c.away} -${lk.line}` };
      const g = by.get(c.game_id) || { id: c.game_id, away: c.away, home: c.home, date: c.date, week: c.week, legs: [] };
      g.legs.push(c); by.set(c.game_id, g);
    }
    for (const g of by.values()) {
      g.legs.sort((a, b) => RANK[b.call] - RANK[a.call] || b.meter - a.meter);
      g.top = g.legs[0];
      g.info = C.games.find((u) => u.away === g.away && u.home === g.home);
    }
    return [...by.values()].sort((a, b) => RANK[b.top.call] - RANK[a.top.call] || b.top.meter - a.top.meter || a.date.localeCompare(b.date));
  };
  const loadPlayers = () => pLoading || (pLoading = fetch('players.json').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => {
    P = d;
    P.byId = new Map(d.profiles.map((p) => [p.player_id, p]));
    P.group = (rows) => { const m = new Map(); for (const r of rows) { (m.get(r.player_id) || m.set(r.player_id, []).get(r.player_id)).push(r); } return m; };
    P.mk = P.group(d.markets); P.lg = P.group(d.logs); P.ss = P.group(d.seasons); P.fx = P.group(d.facts);

  }));

  // ---------- slip ----------
  function meter(v) { const n = Math.round(Math.max(0, Math.min(100, v)) / 10); return h('div', { class: 'meter', 'aria-label': `Trap meter ${v} of 100` }, Array.from({ length: 10 }, (_, i) => h('i', { class: i < n ? 'on' : null }))); }
  function leg(c) {
    return h('div', { class: 'leg', 'data-c': c.call },
      h('div', null, h('div', { class: 'mk' }, `${c.market} · public on`), h('div', { class: 'pub' }, c.popular)),
      h('div', { class: 'score' }, h('b', null, c.meter), 'trap meter'),
      h('div', { class: 'pick', style: 'grid-column:1/-1' }, c.call === 'PASS' ? 'No trap, popular side fairly priced' : c.pick, c.call !== 'PASS' && c.odds != null ? h('small', null, odds(c.odds)) : null),

  }
  function slip(g) {
    const reasons = [...new Set(g.legs.filter((c) => c.call !== 'PASS' && c.reasons).flatMap((c) => c.reasons.split('; ')))].slice(0, 3);
    const kick = g.info ? `${g.info.spread} · O/U ${g.info.total}` : '';
    const legs = g.legs.filter((c) => c.call !== 'PASS');
    const open = () => go('g_' + g.id);
    return h('article', { class: 'slip fade', role: 'link', tabindex: 0, onclick: open, onkeydown: (e) => { if (e.key === 'Enter') open(); } },
      h('div', { class: 'bar' }, h('i', { style: `background:${col(g.away)}` }), h('i', { style: `background:${col(g.home)}` })),
      h('div', { class: 'hd' }, h('span', null, `Week ${g.week} · ${fmtDate(g.date)}`), h('span', null, kick)),
      h('div', { class: 'lbadge', 'data-live-badge': `${g.away}@${g.home}`, hidden: true }),
      h('div', { class: 'mu' }, h('span', { class: 'chip', style: `background:${col(g.away)}` }), h('span', { class: 'tm' }, g.away), h('span', { class: 'at' }, '@'),
        h('span', { class: 'tm' }, g.home), h('span', { class: 'chip', style: `background:${col(g.home)}` }), h('span', { class: 'stamp', 'data-c': g.top.call }, LABEL[g.top.call])),
      h('div', { class: 'perf' }),
      (legs.length ? legs : [g.top]).map(leg),
      reasons.length ? h('ul', { class: 'why' }, reasons.map((r) => h('li', null, r))) : null,
      h('div', { class: 'ft' }, h('span', null, g.info ? `${g.info.away_coach} vs ${g.info.home_coach}` : ''), h('span', null, 'Matchup →')));

  // ---------- screens ----------
  function board() {
    const gs = games();
    const all = recRow('All', 'Both'), live = recRow('Live', 'Both');
    const plays = gs.filter((g) => g.top.call !== 'PASS'), passes = gs.filter((g) => g.top.call === 'PASS');
    const traps = gs.filter((g) => g.top.call === 'TRAP').length;
    return [
      h('section', { class: 'hero fade' },
        h('h1', null, 'Trap', h('span', null, 'or die.')),
        h('ol', { class: 'steps' },
          h('li', null, h('b', null, '1'), h('span', null, 'Most people bet the ', h('em', null, 'favorite'), ' and the ', h('em', null, 'over'), '.')),
          h('li', null, h('b', null, '2'), h('span', null, 'We find games where that popular side has lost more than it should since 1999.')),
          h('li', null, h('b', null, '3'), h('span', null, 'We bet the other side.'))),
        h('div', { class: 'keys' },

    if (ACCT.state !== 'ready') return toast(signIn('join a league'));
    if (code.length !== 6) return toast('League codes are 6 letters and numbers.');
    const d = await ACCT.db.doc('leagues/' + code).get();
    if (!d.exists) return toast('No league with that code. Check it and try again.');
    const L = d.data();
    if (L.kind === 'draft' && L.status !== 'lobby' && !(L.order || []).includes(ACCT.id)) return toast('That league has already drafted, so it is closed to new teams.');
    const teams = await ACCT.db.collection(`leagues/${code}/teams`).get();
    if (L.kind === 'draft' && !teams.docs.some((t) => t.id === ACCT.id) && teams.size >= L.size) return toast('That league is full.');
    try {
      if (!teams.docs.some((t) => t.id === ACCT.id)) await flWrite(() => ACCT.db.doc(`leagues/${code}/teams/${ACCT.id}`).set({ name: ACCT.name || 'My team', joined_at: new Date().toISOString() }));
      if (!ACCT.leagues.includes(code)) await setMyLeagues([...ACCT.leagues, code]);
      go('fl_' + code);
    } catch (e) { /* toast already shown */ }
  }
  async function leaveLeague(code) {

    } catch (e) { /* toast already shown */ }
  }

  function flDraw() {
    const box = FL.box, L = FL.league, code = FL.code;

    if (L === undefined) return;
    if (L === null) { box.replaceChildren(h('p', { class: 'muted', style: 'padding:40px 0;text-align:center' }, 'No league with that code.')); return; }
    const member = FL.teams.some((t) => t.id === ACCT.id);
    const boss = L.created_by === ACCT.id;
    const invite = `Join my Trap Picks fantasy league "${L.name}". Open the app, go to Fantasy, then Fantasy Leagues, and enter code ${code}.`;
    const head = h('div', { class: 'grph fade', style: 'background:linear-gradient(150deg,#5a1d3f,#1d0f2b);border-color:#8a2f63' },
      h('span', null, `${flKinds[L.kind]} · ${L.season}`), h('b', null, L.name),
      h('div', { class: 'gcode' }, h('span', { class: 'mono' }, code), h('button', { onclick: () => {
        if (navigator.share) navigator.share({ text: invite }).catch(() => {});
        else navigator.clipboard.writeText(invite).then(() => toast('Invite copied. Send it to your friends.'), () => toast('Code: ' + code));
      } }, 'Share invite')));
    const out = [head];
    const canJoin = !member && (L.kind === 'weekly' || (L.status === 'lobby' && FL.teams.length < L.size));
    if (canJoin) out.push(h('button', { class: 'save-all', onclick: () => joinLeague(code) }, 'Join this league'));
    if (member) out.push(myTeamName());
    if (L.kind === 'draft') {
      if (L.status === 'lobby') out.push(...lobbyView(L, boss));
      else if (L.status === 'draft') out.push(...draftView(L, boss, member));
      else out.push(...seasonView(L));
    } else out.push(...weeklyView(L, member));
    if (ACCT.leagues.includes(code)) out.push(h('button', { class: 'leave', onclick: () => leaveLeague(code) }, L.kind === 'draft' && L.status !== 'lobby' ? 'Hide from my leagues' : 'Leave league'));

    box.replaceChildren(...out.filter(Boolean));

  async function startDraft() {

    const order = FL.teams.map((t) => t.id);
    for (let i = order.length - 1; i > 0; i--) { const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1); [order[i], order[j]] = [order[j], order[i]]; }

  }

  async function makePick(pid, auto = false) {
    const L = FL.league, n = FL.picks.length, uid = onClock(n, L.order);
    if (L.status !== 'draft') return;

    const ref = ACCT.db.doc(`leagues/${FL.code}/picks/p${pad3(n)}`);
    try {
      const lease = await ref.acquire({ holder: ACCT.id, ttlMs: 8000 });
      if (!lease.acquired) return toast('Someone else is making this pick. One second.');
      if ((await ref.get()).exists) return toast('That pick was just made.');
      await flWrite(() => ref.set({ n, uid, pid: Number(pid), at: new Date().toISOString(), by: ACCT.id, auto }));

    view.replaceChildren(...[nodes].flat(3).filter(Boolean));
    window.scrollTo(0, 0);
    renderLive();
    if (hash !== 'me') sync();
  }
  document.getElementById('back').addEventListener('click', () => { if (history.length > 1) history.back(); else go('board'); });
  window.addEventListener('hashchange', route);

  fetch('core.json').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => {
    C = d;
    const g = new Date(C.meta.generated);
    document.getElementById('upd').append(`NFL · ${C.meta.current_season}`, h('br'), `Updated ${g.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} ${g.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`);
    route();
    initAccount();
    Promise.all(['nfl', 'nba'].map(pollLive)).then(liveLoop);
  }).catch(() => { view.replaceChildren(h('p', { class: 'muted', style: 'padding:40px 0;text-align:center' }, 'The board failed to load. Pull to refresh.')); });
})();
</script>

</body></html>
